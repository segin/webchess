name: Dependabot Auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  auto-merge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    # Dependabot-triggered runs get a read-only token by default, so the
    # merge call needs these granted explicitly.
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run tests
      # `test:comprehensive` and `test:jest` are both aliases for plain `jest`,
      # so this single call is the whole suite - don't add a second invocation.
      run: npm test

    - name: Get Dependabot metadata
      id: dependabot-metadata
      uses: dependabot/fetch-metadata@v3
      with:
        github-token: "${{ secrets.GITHUB_TOKEN }}"
    
    - name: Auto-merge patch and minor updates
      if: steps.dependabot-metadata.outputs.update-type == 'version-update:semver-patch' || steps.dependabot-metadata.outputs.update-type == 'version-update:semver-minor'
      # Merge directly rather than with --auto: the repository has auto-merge
      # disabled and main has no required checks, so --auto cannot queue and
      # would have nothing to wait on. The test step above is the gate - this
      # step only runs if it passed.
      run: |
        gh pr merge --squash --delete-branch "${{ github.event.pull_request.html_url }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Comment on major updates
      if: steps.dependabot-metadata.outputs.update-type == 'version-update:semver-major'
      run: |
        gh pr comment "${{ github.event.pull_request.html_url }}" --body "🚨 Major version update detected. Please review manually before merging."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}